# v4l2-relayd input pipeline: imx471 via libcamera softISP -> v4l2loopback
#
# NO camera-name here, on purpose. Camera selection is done by the systemd drop-in
# 97-libcamera-pipelines.conf (LIBCAMERA_PIPELINES_MATCH_LIST=simple), which makes
# libcamera enumerate only the internal sensor for this service. Reason: libcamerasrc
# without camera-name takes the FIRST camera libcamera lists, and the uvcvideo handler is
# enumerated BEFORE the internal simple pipeline — so with a USB webcam plugged in, relayd
# hijacks the webcam, configures it as YUYV 1920x1080 (which many webcams only offer at
# 5 fps) and republishes that through the loopback, while the internal sensor never streams.
#
# Setting camera-name=\_SB_.LNK0 here instead is a trap: the value passes three layers that
# each eat backslashes — systemd's EnvironmentFile unescaping, systemd's own ${VIDEOSRC}
# expansion into the sh -c script (the unit uses a single $, cf. $${SPLASHSRC}), and finally
# gst_parse_launch. Measured on our machine: 4 backslashes in this file arrive as 1 in the
# process argv, and no count proved reliable. The env var above has no escaping at all.
#
# gamma/contrast/saturation are handled by libcamera's Adjust algorithm (linear domain, via
# the CCM) instead of a videobalance element afterwards: better quality, no extra CPU pass.
# These three are taste — adjust to your liking. Note that exposure-value, brightness and
# sharpness are silently ignored: the soft AGC/IPA registers no such controls.
#
# 1920x1080 with no videoscale: libcamerasrc delivers 1080p directly as a crop of the
# sensor's single 1928x1088 mode. Measured input-chain cost on Panther Lake (GPU debayer):
# 1080p without videoscale 26.8% of a core, vs 33.9% for 1280x720 with videoscale +
# videobalance. Downscaling cost more than the extra pixels.
VIDEOSRC="libcamerasrc gamma=2.4 contrast=1.25 saturation=1.45 ! videoconvert ! videorate drop-only=true skip-to-first=true"
SPLASHSRC="videotestsrc num-buffers=1 pattern=black ! imagefreeze num-buffers=4 ! videoscale ! videoconvert"
FORMAT=NV12
WIDTH=1920
HEIGHT=1080
FRAMERATE=30/1
CARD_LABEL="Hardware ISP Camera"
