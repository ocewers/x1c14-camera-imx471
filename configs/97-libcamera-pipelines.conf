[Service]
# Restrict libcamera to the simple pipeline handler (softISP + imx471) for this service only.
#
# Without this, libcamerasrc picks the first camera libcamera lists, and the uvcvideo handler
# is enumerated BEFORE the internal simple pipeline. With a USB webcam plugged in, relayd
# hijacks the webcam, configures it as YUYV 1920x1080 — a mode many webcams only advertise at
# 5 fps — and republishes those 5 fps through the loopback as "Hardware ISP Camera", while the
# internal sensor never streams at all. Symptom: choppy video in Teams/Meet even in the local
# preview, i.e. before network and encoding, and the internal sensor's exposure/gain frozen at
# their maximum. This bites anyone whose apps read /dev/video50 (see Layer 3 in the README).
#
# LIBCAMERA_PIPELINES_MATCH_LIST is the environment override for the `pipelines_match_list`
# configuration option (comma-separated; see src/libcamera/global_configuration.cpp). It is
# preferable to camera-name in ipu7.conf, which has to survive three layers of backslash
# eating — see the comment in that file.
#
# Scope: only this service. USB webcams are unaffected elsewhere and remain available as
# ordinary V4L2 devices (/dev/videoN) in Teams, Chromium and so on.
Environment=LIBCAMERA_PIPELINES_MATCH_LIST=simple
